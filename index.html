<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyFoodie</title>
    <meta name="author" content="Pham Gia Hien">
    <meta name="description" content="Simple web application for finding recipes by ingredient or by recipe name. Create your own favorite list of recipes that interest you.">

    <style>
        h1 {
            margin: 0 0;
        }

        header {
            display: flex;
            justify-content: left;
            gap: 40px;
            padding: 10px 50px;
        }

        header a {
            text-decoration: none;
            color: #7c1212;
            background-color: #ffffff;
            transition: 0.1s;
        }

        header a:hover {
            transform: scale(1.1);
        }

        nav {
            gap: 20px;
            margin: 10px 0px;
        }

        nav a {
            text-decoration: none;
            color: black;
            background-color: #ffffff;
            text-transform: uppercase;
            padding: 20px;
            border-left: 1px solid #cdcdcd;
            transition: 0.2s;
        }

        nav a:hover {
            background-color: #f1f1f1;
        }

        #search-section {
            width: 100%;
            display: flex;
            -justify-content: center;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .search-undersection {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 800px;
        }

        #search-mode, #favorites-search-mode, #category-filter {
            padding: 4px 7px;
        }

        #search-btn {
            padding: 4px 10px;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            margin: 10px 0;
        }

        #favorites-section {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            -justify-content: center;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #search-result-undersection {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            -justify-content: center;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .tag-text {
            background: #f1f1f1;
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 2px;
            font-size: 12px;
            display: flex;
            align-items: center;
        }

        .tag-btn {
            margin-left: 10px;
            cursor: pointer;
            color: red;
            transition: color 0.1s;
        }

        .tag-btn:hover {
            color: darkred;
        }

        .recipe-box {
            width: 100%;
            max-width: 1000px;
            border-top: 1px solid #eee;
            padding: 5px;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        .tags-container {
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            overflow-wrap: anywhere;
            gap: 5px;
        }

        #favorites-controls {
            margin-bottom: 20px;
        }

        #favorite-window { /* Semi-transparent filter layer */
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        #favorite-subwindow, #tag-selection-subwindow {
            background: white;
            max-width: 300px;
            margin: 200px auto;
            padding: 30px;
            border-radius: 4px;
        }

        #favorite-note {
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }

        #detailAndFavoriteBtnGroup {
            margin: 10px 0;
        }

        button {
            margin: 0 2px;
            cursor: pointer;
        }

        #tag-selection-window { /* Semi-transparent filter layer */
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
        }

        .input-group {
            text-align: left;
            margin-bottom: 10px;
        }

        #existing-tags-select, #custom-tag-input, #favorite-note {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 2px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #favorite-save-btn, #favorite-cancel-btn, #tag-confirm-btn, #tag-cancel-btn {
            padding: 8px 20px;
            cursor: pointer;
        }

    </style>

    <script src="jquery-2.1.4.js"></script>
    <script src="test_data.js"></script>
    <script>
        const API_KEY = "facae78299fa48818719bd325651ed3f";
        //const API_KEY = "test";

        let currentRecipe = {id: null, title: null, image: null, instructions: null};
        let selectedCategories = [];
        const defaultCategories = ['Breakfast', 'Lunch', 'Dinner'];
        let currentEditingRecipeId = null;

        window.onhashchange = function() {
            // Get section from address
            const sectionId = window.location.hash.replace("#", "");

            if (sectionId) {
                $('.toggleable-section').hide(); //Clear canvas

                $(`#${sectionId}`).fadeIn();
                //console.log("Section id: ", sectionId);
                if (sectionId === 'favorites-section') {
                    showMyFavorites();
                }
            }
        };

        $(document).ready(function() {
            //localStorage.clear(); // TODO: remove

            // Set default hash
            if (!window.location.hash) {
                window.location.hash = '#search-section';
            }
            window.onhashchange();

            // Search button click
            $('#search-btn').on('click', function() {
                const query = $('#default-search-input').val();
                const searchMode = $('#search-mode').val();

                if (query) {
                    if (searchMode === 'Recipe') {
                        searchRecipes(query);
                    } else {
                        searchIngredients(query);
                    }
                }
            });

            $('#favorite-add-tag-btn').on('click', function () {
                currentEditingRecipeId = null;
                //const newTag = prompt("Enter category name (e.g. Lunch, Dinner):");
                const uniqueCategories = getUniqueCategories();

                const select = $('#existing-tags-select');
                select.empty();
                select.append('<option value="">-- Select from existing --</option>');

                for (let category of uniqueCategories) {
                    let option = $('<option></option>').val(category).text(category);
                    select.append(option);
                }

                $('#custom-tag-input').val('');
                $('#tag-selection-window').show();
            });

            $('#favorite-save-btn').on('click', async function () {
                let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
                const note = $('#favorite-note').val();
                $(this).text('Saving...').prop('disabled', true);

                // Fetch instructions and toggle
                const success = await saveIngredientsAndInstructions(currentRecipe.id);

                if (success) {
                    favorites.push({id: currentRecipe.id, title: currentRecipe.title, image: currentRecipe.image, note: note, categoryList: selectedCategories });
                    localStorage.setItem('favorites', JSON.stringify(favorites));

                    selectedCategories = [];
                    currentRecipe = {};
                    $('#tags-container-temp').empty();
                    $('#favorite-window').hide();
                } else {
                    alert('Error trying to fetch data, please try again.');
                }
                $(this).text('Save to Favorites').prop('disabled', false);

                //showMyFavorites();
            });

            $('#favorite-cancel-btn').on('click', function () {
                selectedCategories = [];
                $('#tags-container-temp').empty();
                $('#favorite-window').hide();
            });

            $('#tag-confirm-btn').on('click', function () {
                const select = $('#existing-tags-select');
                const tagInput = $('#custom-tag-input');
                const selectVal = select.val();
                const tagInputVal = tagInput.val().trim();

                let finalTag = '';
                if (tagInputVal !== '') {
                    finalTag = tagInputVal;
                } else if (selectVal !== '') {
                    finalTag = selectVal;
                }

                if (finalTag === '') {
                    alert('Pick or add a new tag.');
                    return;
                }

                // Add tag from the favorite section
                if (currentEditingRecipeId) {
                    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

                    for (let recipe of favorites) {
                        if (recipe.id === currentEditingRecipeId) {
                            // A check just to be sure, altough this cannot ever happen
                            if (!recipe.categoryList) {
                                recipe.categoryList = [];
                            }

                            if (!recipe.categoryList.includes(finalTag)) {
                                recipe.categoryList.push(finalTag);
                                localStorage.setItem('favorites', JSON.stringify(favorites));
                                showMyFavorites();
                                //updateCategoryFilter();
                            } else {
                                alert("This tag already exists!");
                                return;
                            }
                            break;
                        }
                    }
                } else {
                    // Control check (duplicates)
                    if (!selectedCategories.includes(finalTag)) {
                        selectedCategories.push(finalTag);
                        renderTempTags();
                    } else {
                        alert("This category has been added already.");
                    }
                }
                $('#tag-selection-window').hide();
                tagInput.val('');
                select.val('');
            });

            $('#tag-cancel-btn').on('click', function () {
                $('#tag-selection-window').hide();
                $('#existing-tags-select').val('');
                $('#custom-tag-input').val('');
            })

            // Show my saved recipes
            //showMyFavorites();
        });

        function getUniqueCategories() {
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];

            const categories = new Set(defaultCategories);

            for (const recipe of favorites) {
                if (recipe.categoryList) {
                    for (const category of recipe.categoryList) {
                        categories.add(category);
                    }
                }
            }

            return Array.from(categories).sort();
        }

        function renderTempTags() {
            let container = $('#tags-container-temp');
            container.empty(); // Clear canvas

            for (let cat of selectedCategories) {
                let divTagText = $('<div class="tag-text"></div>').text(cat);
                let divTagBtn = $('<div class="tag-btn"> x </div>').on('click', function () {
                    removeTempTag(cat);
                });

                divTagText.append(divTagBtn);
                container.append(divTagText);
            }
        }

        function removeTempTag(category) {
            let newCategories = [];

            // Create new array that is without the removed tag
            for (let cat of selectedCategories) {
                if (cat !== category) {
                    newCategories.push(cat);
                }
            }
            selectedCategories = newCategories;

            renderTempTags();
        }

        function searchRecipes(query) {
            $('#results').html('Searching...');

            $.ajax({
                url: `https://api.spoonacular.com/recipes/complexSearch?query=${query}
                      &addRecipeInformation=true
                      &fillIngredients=true
                      &apiKey=${API_KEY}`,
                type: 'GET',
                success: function(data) {
                    showSearchResults(data.results);
                },
                error: function() {
                    $('#results').html('Error during search.');
                    //showSearchResults(test_data.results);
                }
            });
        }

        function searchIngredients(query) {
            $('#results').html('Searching...');

            $.ajax({
                url: `https://api.spoonacular.com/recipes/findByIngredients?ingredients=${query}&apiKey=${API_KEY}`,
                type: 'GET',
                success: function(data) {
                    showSearchResults(data);
                },
                error: function() {
                    $('#results').html('Error during search.');
                    //showSearchResults(ingredient_data);
                }
            });
        }

        function showSearchResults(recipes) {
            const resultsHtml = $(`#results`);
            resultsHtml.empty();
            if (recipes.length === 0) {
                resultsHtml.html('No recipes found.');
                return;
            }

            for (let recipe of recipes) {
                const divRecipeBox = $(`<div class="recipe-box" id="recipe-info-${recipe.id}"></div>`);

                const h3RecipeTitle = $(`<h3></h3>`).text(recipe.title);
                const imgRecipeImage = $(`<img>`).attr({
                    'src': recipe.image,
                    'alt': recipe.title
                });
                const divGroup = $(`<div id="detailAndFavoriteBtnGroup"></div>`);

                const buttonShow = $(`<button> Ingredients & Instructions </button>`).on('click', function (){
                    showIngredientsAndInstructions(recipe.id, 'search-section');
                });
                const buttonOpen = $(`<button> Favorite </button>`).on('click', function () {
                    openFavoriteWindow(recipe.id, recipe.title, recipe.image);
                });
                divGroup.append(buttonShow).append(buttonOpen);

                const divDetail = $(`<div id="detail-search-section-${recipe.id}"></div>`);

                divRecipeBox.append(h3RecipeTitle).append(imgRecipeImage).append(divGroup).append(divDetail);
                resultsHtml.append(divRecipeBox);
            }
        }

        async function saveIngredientsAndInstructions(id) {
            const localData = localStorage.getItem(`recipe_detail_${id}`);
            if (localData) { return true }

            try {
                const recipe = await $.ajax({
                    url: `https://api.spoonacular.com/recipes/${id}/information?apiKey=${API_KEY}`,
                    type: 'GET'
                });
                localStorage.setItem(`recipe_detail_${id}`, JSON.stringify(recipe));
                return true;
            } catch (error) {
                return false;
            }
        }

        function  showIngredientsAndInstructions(id, sectionId) {
            const detail = $(`#detail-${sectionId}-${id}`);

            // Toggle effect
            if (detail.html().trim() !== "") {
                detail.empty();
                return;
            }

            // Save detail data even for recipes that are not in favorites yet
            const localData = localStorage.getItem(`recipe_detail_${id}`);
            if (localData) {
                showDetailHtml(detail, JSON.parse(localData));
                return;
            }

            detail.html('Loading detail...');

            $.ajax({
                url: `https://api.spoonacular.com/recipes/${id}/information?apiKey=${API_KEY}`,
                type: 'GET',
                success: function (recipe) {
                    //console.log(recipe)
                    localStorage.setItem(`recipe_detail_${id}`, JSON.stringify(recipe));
                    showDetailHtml(detail, recipe);
                },
                error: function() {
                    //localStorage.setItem(`recipe_detail_${id}`, JSON.stringify(detail_data));
                    //showDetailHtml(detail, detail_data);
                    detail.html('Error trying to find recipe details.');
                }
            });
        }

        function getCleanInstructions(rawHtml) {
            if (!rawHtml) return 'No instructions found.';

            // Replace with newlines
            let formattedHtml = rawHtml.replace(/<\/p>|<\/li>/g, '\n');

            // Get rid of HTML tags
            const doc = new DOMParser().parseFromString(formattedHtml, 'text/html');
            return doc.body.textContent.trim();
        }

        function showDetailHtml(detail, recipe) {
            detail.empty();
            const divGroup = $(`<div></div>`);

            const ul = $(`<ul></ul>`);
            if (recipe.extendedIngredients) {
                for (let ing of recipe.extendedIngredients) {
                    const li = $('<li></li>');

                    const amount = ing.measures?.metric?.amount || '';
                    const unit = ing.measures?.metric?.unitShort || '';

                    li.text(`${amount} ${unit} - ${ing.name}`);
                    ul.append(li);
                }
            } else {
                ul.append($('<li></li>').text('No ingredients found.'));
            }

            const pInstructions = $(`<p style="white-space: pre-line"></p>`).html(getCleanInstructions(recipe.instructions));
            const pReady = $('<p></p>').text(`Ready in: ${recipe.readyInMinutes || 'Undetermined'} minutes`);

            divGroup.append(`<h3> Ingredients: </h3>`)
                .append(ul)
                .append(`<h3> Steps </h3>`)
                .append(pInstructions)
                .append(pReady);
            detail.append(divGroup);
        }

        function openFavoriteWindow(id, title, image) {
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            // Check if already favorited
            for (let recipe of favorites) {
                if (recipe.id === id) {
                    alert("This recipe is already in your Favorites.");
                    return;
                }
            }

            currentRecipe = {id: id, title: title, image: image};
            $('#save-recipe-text').text("Save recipe: " + title);
            $('#favorite-window').show();
        }

        function showMyFavorites() {
            const selectedCategory = $('#category-filter').val();
            const searchInput = $('#favorites-search-input').val().toLowerCase();
            const searchMode = $('#favorites-search-mode').val();
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            let favoritesHtml = $('#favorites');
            let found = false;
            favoritesHtml.empty();
            //console.log('favorites', favorites);

            // Create HTML
            for (let recipe of favorites) {
                // Filter by category
                if (!recipe.categoryList.includes(selectedCategory) && selectedCategory!=='All') {
                    continue;
                }

                if (searchInput !== '') {
                    if (searchMode === 'Recipe') {
                        if (!recipe.title.toLowerCase().includes(searchInput)) {
                            continue;
                        }
                    } else {
                        const detailData = localStorage.getItem(`recipe_detail_${recipe.id}`);
                        if (!detailData) { continue; }
                        const recipeDetail = JSON.parse(detailData);
                        let foundIngredient = false;
                        if (recipeDetail.extendedIngredients) {
                            for (let ingredient of recipeDetail.extendedIngredients) {
                                if (ingredient.name.toLowerCase().includes(searchInput)) {
                                    foundIngredient = true;
                                    break;
                                }
                            }
                        }
                        if (!foundIngredient) {
                            continue;
                        }
                    }
                }
                found = true;

                const divRecipeBox = $('<div class="recipe-box"></div>')
                const h3RecipeTitle = $('<h3></h3>').text(recipe.title);
                const imgRecipeImage = $('<img>').attr({
                    'src': recipe.image,
                    'alt': recipe.title
                })

                const divTagsContainerId = $(`<div id="tags-container-${recipe.id}" class="tags-container"></div>`)
                const buttonAddTag = $('<button> + </button>').on('click', function() {
                    addTagToExistingRecipe(recipe.id);
                });

                const emNote = $('<em></em>').text('Note: ' + (recipe.note || ''));
                const buttonEditNote = $('<button> Edit </button>').on('click', function() {
                    editNote(recipe.id);
                });

                const divGroup = $('<div></div>');
                const buttonShow = $('<button> Ingredients & Instructions </button>').on('click', function() {
                    showIngredientsAndInstructions(recipe.id, 'favorite-section');
                });
                const buttonRemove = $('<button> Remove from Favorites </button>').on('click', function() {
                    removeFavorite(recipe.id, recipe.title);
                });
                divGroup.append(buttonShow).append(buttonRemove);

                const divDetail = $(`<div id="detail-favorite-section-${recipe.id}"></div>`);

                divRecipeBox.append(h3RecipeTitle)
                    .append(imgRecipeImage)
                    .append(divTagsContainerId)
                    .append(buttonAddTag).append('<br>').append('<br>')
                    .append(emNote).append('<br>')
                    .append(buttonEditNote).append('<br>').append('<br>')
                    .append(divGroup).append('<br>')
                    .append(divDetail);
                favoritesHtml.append(divRecipeBox);

                //const container = $(`#tags-container-${recipe.id}`);
                renderPermanentTags(recipe.id, divTagsContainerId, recipe.categoryList);
            }
            if (!found) {
                favoritesHtml.html('No recipes found.');
            }

            updateCategoryFilter();
        }

        function removeFavorite(id, title) {
            const check = confirm(`Do you want to remove the recipe ${title} from your favorites list?`);
            if (check === false) {
                return;
            }

            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            let updatedFavorites = []
            for (let recipe of favorites) {
                if (recipe.id === id) {
                    continue;
                }
                updatedFavorites.push(recipe);
            }
            localStorage.setItem('favorites', JSON.stringify(updatedFavorites));

            // Update
            showMyFavorites();
        }

        function editNote(id) {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            for (let recipe of favorites) {
                if (recipe.id === id) {
                    const newNote = prompt("Edit note: ", recipe.note);
                    if (newNote !== null) {
                        recipe.note = newNote;
                        // Update
                        localStorage.setItem('favorites', JSON.stringify(favorites));

                        // Refresh
                        showMyFavorites();
                    }
                }
            }
        }

        function renderPermanentTags(id, container, categoryList) {
            container.empty(); // Clear canvas

            for (let category of categoryList) {
                let divTagText = $('<div class="tag-text"></div>').text(category);
                let divTagBtn = $('<div class="tag-btn"> x </div>').on('click', function () {
                    removeTagFromExistingRecipe(id, category);
                });

                divTagText.append(divTagBtn);
                container.append(divTagText);
            }
        }

        function removeTagFromExistingRecipe(id, category) {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

            for (let recipe of favorites) {
                if (recipe.id === id) {
                    let newCategories = [];
                    // Create new array that is without the removed tag
                    for (let cat of recipe.categoryList) {
                        if (cat !== category) {
                            newCategories.push(cat);
                        }
                    }
                    recipe.categoryList = newCategories;
                    localStorage.setItem('favorites', JSON.stringify(favorites));

                    showMyFavorites();
                    return;
                }
            }
        }

        function addTagToExistingRecipe(id) {
            currentEditingRecipeId = id;
            const uniqueCategories = getUniqueCategories();
            const select = $('#existing-tags-select');
            select.empty();
            select.append('<option value="">-- Select from existing --</option>');

            for (let category of uniqueCategories) {
                let option = $('<option></option>').val(category).text(category);
                select.append(option);
            }

            $('#custom-tag-input').val('');
            $('#tag-selection-window').show();
            /*
            const newTag = prompt("Enter category name (e.g. Lunch, Dinner):");

            if (newTag && newTag.trim() !== "") {
                const cleanTag = newTag.trim();

                let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

                for (let recipe of favorites) {
                    if (recipe.id === id) {
                        // A check just to be sure, altough this cannot ever happen
                        if (!recipe.categoryList) {
                            recipe.categoryList = [];
                        }

                        if (!recipe.categoryList.includes(cleanTag)) {
                            recipe.categoryList.push(cleanTag);
                            //updateCategoryFilter();
                        } else {
                            alert("This tag already exists!");
                            return;
                        }
                        break;
                    }
                }

                // Update
                localStorage.setItem('favorites', JSON.stringify(favorites));

                // Refresh
                showMyFavorites();
            }
             */
        }

        function updateCategoryFilter() {
            const filterSelect = $('#category-filter');
            const currentSelection = filterSelect.val();
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];

            const categoryList = [];
            for (const recipe of favorites) {
                if (!recipe.categoryList) {continue}

                for (const category of recipe.categoryList) {
                    if (!categoryList.includes(category)) {
                        categoryList.push(category);
                    }
                }
            }

            filterSelect.html('<option value="All"> All </option>'); //Clear

            for (const category of categoryList) {
                let option = $('<option></option>').val(category).text(category);
                filterSelect.append(option);

                //filterSelect.append(`<option value="${category}">${category}</option>`);
            }

            filterSelect.val(currentSelection);
        }

        function changeSearchText(selectedSearchMode = "Recipe") {
            let text = "Search for recipe (e.g. chicken...)";
            if (selectedSearchMode === 'Ingredient') {
                text = "Search from ingredients (e.g. sugar,apples...)";
            }
            $('.search-input').attr('placeholder', text);
        }

    </script>
</head>

<body>
<header>
    <a href="#search-section">
        <h1>MyFoodie</h1>
    </a>
    <nav>
        <a href="#search-section"> Search </a>
        <a href="#favorites-section"> My favorites </a>
    </nav>
</header>

<div id="search-section" class="toggleable-section">
    <div class="search-undersection">
        <label for="search-mode"> Search by: </label>
        <select id="search-mode" onchange="changeSearchText(this.value)">
            <option value="Recipe"> Recipe Name </option>
            <option value="Ingredient"> Ingredient </option>
        </select>
        <input type="text" id="default-search-input" class="search-input" placeholder="Search for recipe (e.g. chicken...)">
        <button id="search-btn"> Search </button>
    </div>

    <div id="search-result-undersection">
        <h2> Search results </h2>
        <div id="results">
        </div>
    </div>
</div>

<div id="favorites-section" class="toggleable-section">
    <h2> My favorite recipes </h2>
    <div class="search-undersection">
        <label for="favorites-search-mode"> Search by: </label>
        <select id="favorites-search-mode" onchange="changeSearchText(this.value)">
            <option value="Recipe"> Recipe Name </option>
            <option value="Ingredient"> Ingredient </option>
        </select>
        <input type="text" id="favorites-search-input" class="search-input" placeholder="Search for recipe (e.g. chicken...)" oninput="showMyFavorites()">
    </div>
    <div id="favorites-controls">
        <label for="category-filter"> Filter by category: </label>
        <select id="category-filter" onchange="showMyFavorites()">
            <option value="All"> All </option>
        </select>
    </div>
    <div id="favorites">
    </div>
</div>

<div id="favorite-window">
    <div id="favorite-subwindow">
        <h3 id="save-recipe-text"> Save Recipe </h3>

        <label> Category: </label><br>
        <div id="tags-container-temp" class="tags-container"></div>
        <button id="favorite-add-tag-btn"> + </button><br><br>

        <label> Note: </label><br>
        <textarea id="favorite-note" placeholder="Your note..."></textarea><br><br>

        <div class="button-group">
            <button id="favorite-save-btn"> Save to Favorites </button>
            <button id="favorite-cancel-btn"> Cancel </button>
        </div>
    </div>
</div>

<div id="tag-selection-window">
    <div id="tag-selection-subwindow">
        <h3>Add Category</h3>

        <div class="input-group">
            <label for="existing-tags-select">Choose existing:</label>
            <select id="existing-tags-select"></select>
        </div>

        <div class="input-group">
            <label for="custom-tag-input">Or add new one:</label>
            <input type="text" id="custom-tag-input" placeholder="e.g. Easy">
        </div>

        <div class="button-group">
            <button id="tag-confirm-btn">Add</button>
            <button id="tag-cancel-btn">Cancel</button>
        </div>
    </div>
</div>

</body>
</html>
